<!doctype html>
<html lang="en">
	<head>
		<title>temlo</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col">
		<header class="w-full max-w-3xl mx-auto px-6 pt-12 pb-8">
			<a href="/" class="text-2xl font-bold tracking-tight text-white">temlo</a>
		</header>

		<main class="flex-1 w-full max-w-3xl mx-auto px-6 space-y-12">
			<section>
				<h1 class="text-4xl sm:text-5xl font-extrabold text-white">
					Hello, temlo<span class="text-teal-400">!</span>
				</h1>
				<p class="mt-4 text-slate-400 text-lg">
					Welcome to temlo — a minimal, beautiful one-page site.
				</p>
			</section>

			<section>
				<h2 class="text-lg font-semibold text-slate-300 uppercase tracking-widest">
					Contacts
				</h2>
				<ul class="mt-4 space-y-3">
					<li class="flex items-center gap-3 rounded-xl border border-slate-800 bg-slate-900/50 px-4 py-3">
						<span class="text-sm font-medium text-slate-400 w-16">email</span>
						<address class="not-italic text-teal-300">support@temlo.lol</address>
					</li>
					<li class="flex items-center gap-3 rounded-xl border border-slate-800 bg-slate-900/50 px-4 py-3">
						<span class="text-sm font-medium text-slate-400 w-16">phone</span>
						<a href="tel:7777777777" class="text-teal-300 hover:text-teal-200 transition-colors">
							7777777777
						</a>
					</li>
				</ul>
			</section>
		</main>

		<footer class="w-full max-w-3xl mx-auto px-6 py-10">
			<p class="text-sm text-slate-600">&copy; 2026 temlo</p>
		</footer>
	</body>
</html>
